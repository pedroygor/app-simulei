# Valor FAKE usado só nos testes (precisa de >= 32 bytes pro HS256).
# Não é segredo: o real vem de JWT_SECRET no ambiente e nunca entra no git.
jwt.secret=segredo-fake-de-teste-com-mais-de-32-bytes-para-hs256-funcionar

# Habilita o contador de queries do Hibernate. QuestaoControllerTest usa isso
# pra provar que a listagem não faz N+1 — sem esta linha, Statistics vem zerado.
spring.jpa.properties.hibernate.generate_statistics=true

# Storage de imagens isolado nos testes (nenhum teste grava aqui hoje, mas
# evita que um teste futuro suje o ./storage de desenvolvimento)
storage.imagens.diretorio=${java.io.tmpdir}/simulei-teste-imagens
