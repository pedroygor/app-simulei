# Configuração comum a todos os perfis.
# Nenhum segredo aqui: tudo vem de variável de ambiente (${VAR}).
spring:
  application:
    name: api
  config:
    # Carrega o .env da raiz como fonte de propriedades no startup, pra não
    # depender de 'source .env' no shell antes de rodar. 'optional:' faz o Boot
    # seguir em frente quando o arquivo não existe (prod), e variável de
    # ambiente de verdade tem precedência maior que este arquivo.
    import: optional:file:.env[.properties]
  # Se nenhum perfil for informado, assume dev (na máquina local).
  # Em prod, ativar com SPRING_PROFILES_ACTIVE=prod.
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # validate: o Hibernate só CONFERE se as entidades batem com o schema.
      # Quem cria/altera tabela é o Flyway, via migration. Nunca 'update'.
      ddl-auto: validate
    # Desliga o anti-pattern Open Session in View: sem isso, o Spring mantém
    # a sessão do Hibernate aberta durante toda a request e mascara lazy loading
    # fora da transação — o que esconde exatamente os N+1 que queremos ver.
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        # Teto do ?size= nas listagens paginadas (o default do Spring é 2000)
        max-page-size: 100

jwt:
  # Segredo HMAC do JWT: só via ambiente, mínimo 32 bytes (HS256)
  secret: ${JWT_SECRET}
  access-ttl: 30m
  refresh-ttl: 7d

# URL pública, não é segredo — pode viver no yml
enem-dev:
  base-url: https://api.enem.dev/v1

storage:
  imagens:
    # Onde as imagens baixadas da enem.dev são gravadas. Fora do src, e no
    # .gitignore: são ~980 arquivos de dado importado, não de código.
    diretorio: ${STORAGE_IMAGENS_DIR:./storage/imagens}
    # Prefixo das URLs gravadas no markdown das questões.
    # Em produção isto vira o host do CDN/bucket (ex: https://img.simulei.com.br)
    # e a aplicação para de servir arquivo estático — ver ADR de 26/08/2026.
    base-url: /imagens
    # Teto por arquivo. A maior imagem do ENEM 2023 tem ~540KB; 5MB é folga
    # generosa e ainda protege contra resposta gigante da fonte.
    tamanho-maximo: 5MB

---
# Documento ativado só quando o perfil dev está ativo
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    # Ver as queries geradas é regra do projeto (seção 8.4 do CLAUDE.md)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
