# Configuração comum a todos os perfis.
# Nenhum segredo aqui: tudo vem de variável de ambiente (${VAR}).
spring:
  application:
    name: api
  config:
    # Carrega o .env da raiz do repositório como fonte de propriedades no
    # startup, pra não depender de 'source .env' no shell antes de rodar.
    #
    # São DOIS caminhos porque o .env mora na raiz e o backend é um nível
    # abaixo: '../.env' cobre o comando normal (cd backend && ./mvnw) e '.env'
    # cobre quem rodar da raiz. Os dois são 'optional:', então o que não existir
    # é ignorado em silêncio — inclusive em produção, onde não há .env nenhum e
    # tudo vem de variável de ambiente de verdade (que tem precedência maior).
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # Se nenhum perfil for informado, assume dev (na máquina local).
  # Em prod, ativar com SPRING_PROFILES_ACTIVE=prod.
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # validate: o Hibernate só CONFERE se as entidades batem com o schema.
      # Quem cria/altera tabela é o Flyway, via migration. Nunca 'update'.
      ddl-auto: validate
    # Desliga o anti-pattern Open Session in View: sem isso, o Spring mantém
    # a sessão do Hibernate aberta durante toda a request e mascara lazy loading
    # fora da transação — o que esconde exatamente os N+1 que queremos ver.
    open-in-view: false
    properties:
      hibernate:
        # UPDATEs do mesmo tipo vão ao banco em lotes de 50 num só round-trip,
        # em vez de um por linha. Quem mais ganha é a carga da classificação
        # (até 2.741 UPDATEs). order_updates agrupa por entidade pra o lote não
        # ser quebrado a cada troca de tipo. INSERT com IDENTITY não entra em
        # lote (o Hibernate precisa do id gerado na hora), então a importação
        # de questões não muda.
        jdbc:
          batch_size: 50
        order_updates: true
  flyway:
    enabled: true
  data:
    web:
      pageable:
        # Teto do ?size= nas listagens paginadas (o default do Spring é 2000)
        max-page-size: 100

jwt:
  # Segredo HMAC do JWT: só via ambiente, mínimo 32 bytes (HS256)
  secret: ${JWT_SECRET}
  access-ttl: 30m
  refresh-ttl: 7d

app:
  cors:
    # Origens do frontend. Lista explícita, nunca "*": com allowCredentials
    # (necessário pro cookie de refresh) o navegador recusa o curinga.
    # Em produção: CORS_ORIGENS=https://app.simulei.com.br
    origens: ${CORS_ORIGENS:http://localhost:3000}

# URL pública, não é segredo — pode viver no yml
enem-dev:
  base-url: https://api.enem.dev/v1

storage:
  imagens:
    # Onde as imagens baixadas da enem.dev são gravadas: na RAIZ do repositório,
    # fora de backend/ e no .gitignore — é dado importado, não código, e não
    # pertence a nenhuma das duas aplicações em particular.
    #
    # O default é relativo ao diretório de execução, e o comando canônico roda
    # de backend/ (daí o '../'). Rodando de outro lugar, defina STORAGE_IMAGENS_DIR.
    diretorio: ${STORAGE_IMAGENS_DIR:../storage/imagens}
    # Prefixo das URLs gravadas no markdown das questões.
    # Em produção isto vira o host do CDN/bucket (ex: https://img.simulei.com.br)
    # e a aplicação para de servir arquivo estático — ver ADR de 26/08/2026.
    base-url: /imagens
    # Teto por arquivo. A maior imagem do ENEM 2023 tem ~540KB; 5MB é folga
    # generosa e ainda protege contra resposta gigante da fonte.
    tamanho-maximo: 5MB

classificacao:
  # Saída da classificação por assunto (ADR de 29/09/2026), versionada no
  # repositório. Relativo a backend/, como o storage; --arquivo sobrescreve.
  arquivo: ${CLASSIFICACAO_ARQUIVO:../dados/classificacao/assuntos.csv}

conferencia-inep:
  # Correções de gabarito e anulações do INEP (2b.7, docs/conferencia-inep.md).
  # Mesmo esquema: relativo a backend/, --arquivo sobrescreve
  arquivo: ${CONFERENCIA_INEP_ARQUIVO:../dados/conferencia-inep/correcoes.csv}

habilidades-inep:
  # Habilidade oficial e dificuldade TRI de cada questão, geradas dos microdados por
  # ferramentas/inep/gerar_habilidades.py. Mesmo esquema: relativo a backend/
  arquivo: ${HABILIDADES_INEP_ARQUIVO:../dados/conferencia-inep/habilidades.csv}

incompletas:
  # Questões sem o texto-base ou a imagem de que dependem (nunca mostradas nem
  # sorteadas, V9). Lista completa, revisada à mão. Relativo a backend/
  arquivo: ${INCOMPLETAS_ARQUIVO:../dados/qualidade/questoes_incompletas.csv}

---
# Documento ativado só quando o perfil dev está ativo
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    # Ver as queries geradas é regra do projeto (seção 8.4 do CLAUDE.md)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
