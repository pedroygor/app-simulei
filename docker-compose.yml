services:
  postgres:
    image: postgres:16
    container_name: simulados-postgres
    # ${VAR:?msg} faz o compose FALHAR se a variável não existir,
    # em vez de subir o banco com credencial vazia
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # Amarrado no loopback: o banco de dev não fica exposto na rede local.
      # 5433 no host porque a máquina já tem um Postgres do sistema na 5432.
      # Trocar via POSTGRES_PORT no .env (o DB_URL precisa acompanhar).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
